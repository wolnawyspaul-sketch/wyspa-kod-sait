<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyspa Wolnosci | Klub dla nastolatkow w Polsce</title>
<style>
  :root{--bg:#0e0514;--purple:#8a1a9e;--magenta:#e91e9c;--orange:#ff7a1a;--teal:#00d1a0;--text:#fff;--muted:#cfc3dd}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6}
  h1,h2,h3{line-height:1.15;font-weight:800;letter-spacing:.02em}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .hero{min-height:100vh;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px;
    background:radial-gradient(ellipse 60% 45% at 85% 5%, rgba(255,122,26,.55), transparent 60%),
      radial-gradient(ellipse 55% 50% at 5% 90%, rgba(233,30,156,.35), transparent 60%),var(--bg)}
  .hero .badge{font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}
  .hero-words{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px 44px;max-width:1200px}
  .hero-word{font-size:clamp(22px,4.2vw,54px);font-weight:900;text-transform:uppercase;opacity:0;transform:translateY(30px) rotate(-2deg);animation:pop 1s cubic-bezier(.2,.9,.3,1.2) forwards;white-space:nowrap}
  .hero-word span{display:block}
  .hero-word:nth-child(odd){animation-delay:.2s}
  .hero-word:nth-child(3){animation-delay:.4s}
  .hero-word:nth-child(5){animation-delay:.6s}
  .hero-word:nth-child(7){animation-delay:.8s}
  @keyframes pop{to{opacity:1;transform:none}}
  .people{display:inline-flex;align-items:flex-end;gap:6px;margin:0 6px;vertical-align:middle}
  .people span{width:10px;border-radius:6px 6px 3px 3px;display:inline-block;transform-origin:bottom;animation:sway 2.4s ease-in-out infinite}
  .people span:nth-child(1){height:26px;background:var(--orange)}
  .people span:nth-child(2){height:34px;background:var(--magenta);animation-delay:.2s}
  .people span:nth-child(3){height:30px;background:var(--teal);animation-delay:.4s}
  .people span:nth-child(4){height:36px;background:var(--orange);animation-delay:.6s}
  .people span:nth-child(5){height:27px;background:var(--magenta);animation-delay:.8s}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .hero .scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;letter-spacing:.3em;text-transform:uppercase;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}

  nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(14,5,20,.75);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
  nav .logo{font-weight:900;font-size:20px;letter-spacing:.06em}
  nav .logo em{font-style:normal;color:var(--magenta)}
  nav ul{display:flex;gap:26px;list-style:none;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
  nav ul a{color:var(--muted);transition:color .2s}
  nav ul a:hover{color:#fff}
  @media(max-width:820px){nav ul{display:none}}

  section{padding:110px 24px;position:relative}
  .wrap{max-width:1150px;margin:0 auto;position:relative;z-index:2}
  .kicker{display:block;text-align:center;font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .title{text-align:center;font-size:clamp(28px,4.5vw,52px);text-transform:uppercase;margin-bottom:26px}
  .grad-text{background:linear-gradient(90deg,var(--magenta),var(--orange),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{max-width:760px;margin:0 auto 30px;text-align:center;color:var(--muted);font-size:17px}
  .blob-bg::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 45% 40% at 90% 10%, rgba(0,209,160,.35), transparent 65%),
      radial-gradient(ellipse 40% 35% at 8% 85%, rgba(255,122,26,.28), transparent 65%),
      radial-gradient(ellipse 35% 30% at 50% 50%, rgba(233,30,156,.22), transparent 70%)}
  .about-band{margin:50px auto 0;max-width:900px;text-align:center;font-size:clamp(17px,2.2vw,22px);font-weight:600;padding:34px 28px;border-radius:24px;background:linear-gradient(90deg,rgba(233,30,156,.18),rgba(0,209,160,.18));border:1px solid rgba(255,255,255,.08)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:56px}
  .stat{border-radius:22px;padding:30px 24px;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:transform .3s,border-color .3s}
  .stat:hover{transform:translateY(-6px);border-color:var(--magenta)}
  .stat b{display:block;font-size:44px;font-weight:900;background:linear-gradient(90deg,var(--magenta),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{color:var(--muted);font-size:15px}
  .quote{max-width:820px;margin:56px auto 0;padding:40px 36px;border-radius:26px;background:linear-gradient(135deg,rgba(138,26,158,.35),rgba(233,30,156,.15));border:1px solid rgba(255,255,255,.1);font-size:18px}
  .quote .mark{font-size:64px;line-height:0;color:var(--magenta);display:block;margin:22px 0 4px}
  .quote footer{margin-top:18px;font-weight:700;color:var(--teal)}
  .programs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;margin-top:56px}
  .card{border-radius:26px;padding:36px 30px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);transition:transform .3s,border-color .3s}
  .card:hover{transform:translateY(-8px);border-color:var(--teal)}
  .card .tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:16px;background:linear-gradient(90deg,var(--magenta),var(--orange))}
  .card h3{font-size:24px;margin-bottom:14px;text-transform:uppercase}
  .card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:16px 0}
  .card dt{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em;padding-top:2px}
  .card dd{font-weight:600}
  .card p{color:var(--muted);font-size:15px}
  .logo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:50px}
  .logo-cell{height:96px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.3s;overflow:hidden}
  .logo-cell img{max-height:70px;max-width:85%;object-fit:contain;filter:grayscale(1);opacity:.8}
  .logo-cell.txt{font-weight:800;font-size:18px;letter-spacing:.05em;filter:grayscale(1);opacity:.75}
  .logo-cell:hover{border-color:var(--orange)}
  .logo-cell:hover img,.logo-cell.txt:hover{filter:none;opacity:1}
  .benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:56px}
  .benefit{padding:28px 26px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09)}
  .benefit h3{font-size:17px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .benefit h3::before{content:"✦ ";color:var(--orange)}
  .benefit p{color:var(--muted);font-size:14.5px}
  .team{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;margin-top:50px}
  .member{text-align:center;max-width:240px}
  .member .avatar{width:190px;height:190px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--teal),var(--purple));border:4px solid rgba(255,255,255,.15);overflow:hidden;background-size:cover;background-position:center}
  .member h3{font-size:18px;letter-spacing:.06em}
  .member p{color:var(--muted);font-size:14px;margin-top:6px}
  .contact{text-align:center;background:radial-gradient(ellipse 50% 60% at 50% 0%, rgba(233,30,156,.25), transparent 70%),radial-gradient(ellipse 40% 50% at 100% 100%, rgba(0,209,160,.2), transparent 70%)}
  .contact .big{font-size:clamp(24px,4vw,44px);font-weight:900;text-transform:uppercase;max-width:900px;margin:0 auto 46px}
  .contact-info{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;font-size:17px}
  .contact-info div{padding:20px 30px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
  .contact-info b{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  footer.site{padding:34px 24px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid rgba(255,255,255,.07)}
  .reveal{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}
  .reveal.visible{opacity:1;transform:none}
</style>
</head>
<body>

<nav>
  <div class="logo">WYSPA <em>WOLNOŚCI</em></div>
  <ul>
    <li><a href="#about">O nas</a></li>
    <li><a href="#program">Program</a></li>
    <li><a href="#events">Wydarzenia</a></li>

<header class="hero">

<section id="about" class="blob-bg"><div class="wrap">

<section class="blob-bg"><div class="wrap">

<section id="events" class="blob-bg"><div class="wrap">

<section id="partners" class="blob-bg"><div class="wrap">

  <p class="lead reveal" id="pt-text" style="margin-top:44px"></p>
</div></section>

<section class="blob-bg"><div class="wrap">
  <span class="kicker" id="b-kicker"></span>
  <h2 class="title reveal" id="b-title"></h2>
  <div class="benefits" id="b-items"></div>
  <p class="lead reveal" id="b-outro" style="margin-top:44px"></p>
</div></section>

<section id="team" class="blob-bg"><div class="wrap">
  <span class="kicker" id="t-kicker"></span>
  <h2 class="title reveal" id="t-title"></h2>
  <div class="team" id="t-members"></div>
</div></section>

<section id="contact" class="contact"><div class="wrap">
  <span class="kicker" id="c-kicker"></span>
  <h2 class="title reveal" id="c-title"></h2>
  <p class="big reveal" id="c-big"></p>
  <div class="contact-info reveal">

    <div><b>Telefon</b><span id="c-phones"></span></div>
    <div><b>E-mail</b><span id="c-email"></span></div>
  </div>
</div></section>

/* ===== ДАННЫЕ САЙТА (редактируются через admin.html) ===== */

  statsTitle:"Główne fakty o klubie",
  stats:[

  ],
  quoteKicker:"Переваги участі", quoteTitle:"Zalety klubu",
  quoteTag:"ZAPOBIEGANIE SAMOTNOŚCI",
  quoteText:"Wyspa to po prostu cudowne miejsce, gdzie wspaniali ludzie spotykają się i komunikują! Dają tu poczucie żywego kontaktu, własnego kręgu 🌞 Po pierwszych 6 miesiącach w nowym kraju byłam prawie pewna, że nie znajdę przyjaciół, ale klub zmienił wszystko. Już na pierwszych spotkaniach znalazłam przyjaciół, a nawet zostałam zaproszona na urodziny! To bardzo ważna i potrzebna społeczność, chcę, żeby rozkwitała i żeby coraz więcej nastolatków mogło znaleźć przyjaciół i ludzi o podobnych poglądach!",

/* Админка может встроить данные прямо в файл при публикации: */

var DATA = SITE_DATA_OVERRIDE || (function(){try{return JSON.parse(localStorage.getItem('wyspa_data'))}catch(e){return null}})() || DEFAULT_DATA;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function gradTitle(t){var parts=String(t).split(' ');var last=parts.pop();return esc(parts.join(' '))+' <span class="grad-text">'+esc(last)+'</span>'}
var WORD_COLORS=['#ffffff','var(--teal)','var(--orange)','var(--magenta)'];

/* рендер */
document.getElementById('h-badge').textContent=DATA.badge;
document.getElementById('h-words').innerHTML=DATA.words.map(function(w){
  return '<div class="hero-word">'+w.lines.map(function(l){return '<span style="color:'+WORD_COLORS[w.color%4]+'">'+esc(l)+'</span>'}).join('')+'</div>';
}).join('<div class="people"><span></span><span></span><span></span><span></span><span></span></div>');
document.getElementById('a-kicker').textContent=DATA.aboutKicker;
document.getElementById('a-title').innerHTML=gradTitle(DATA.aboutTitle);
document.getElementById('a-paras').innerHTML=DATA.aboutParas.map(function(p){return '<p class="lead reveal">'+esc(p)+'</p>'}).join('');
document.getElementById('a-band').textContent=DATA.aboutBand;
document.getElementById('a-stats-title').innerHTML=gradTitle(DATA.statsTitle);
document.getElementById('a-stats').innerHTML=DATA.stats.map(function(s){return '<div class="stat reveal"><b>'+esc(s.n)+'</b><span>'+esc(s.t)+'</span></div>'}).join('');
document.getElementById('q-kicker').textContent=DATA.quoteKicker;
document.getElementById('q-title').innerHTML=gradTitle(DATA.quoteTitle);
document.getElementById('q-tag').textContent=DATA.quoteTag;
document.getElementById('q-text').textContent=DATA.quoteText;
document.getElementById('q-author').textContent=DATA.quoteAuthor;
document.getElementById('p-kicker').textContent=DATA.progKicker;
document.getElementById('p-title').innerHTML=gradTitle(DATA.progTitle);
document.getElementById('p-cards').innerHTML=DATA.programs.map(function(p){
  return '<div class="card reveal"><span class="tag">'+esc(p.tag)+'</span><h3>'+esc(p.title)+'</h3><dl>'+
    p.rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+
    '</dl><p>'+esc(p.text)+'</p></div>';
}).join('');
document.getElementById('e-kicker').textContent=DATA.evKicker;
document.getElementById('e-title').innerHTML=gradTitle(DATA.evTitle);
document.getElementById('e-text').textContent=DATA.evText;
document.getElementById('pt-kicker').textContent=DATA.ptKicker;
document.getElementById('pt-title').innerHTML=gradTitle(DATA.ptTitle);
document.getElementById('pt-grid').innerHTML=DATA.logos.map(function(l){
  return l.img ? '<div class="logo-cell reveal"><img src="'+l.img+'" alt="'+esc(l.name)+'"></div>'
               : '<div class="logo-cell txt reveal">'+esc(l.name)+'</div>';
}).join('');
document.getElementById('pt-text').textContent=DATA.ptText;
document.getElementById('b-kicker').textContent=DATA.benKicker;
document.getElementById('b-title').innerHTML=gradTitle(DATA.benTitle);
document.getElementById('b-items').innerHTML=DATA.benItems.map(function(b){
  return '<div class="benefit reveal"><h3>'+esc(b.h)+'</h3><p>'+esc(b.p)+'</p></div>'}).join('');
document.getElementById('b-outro').textContent=DATA.benOutro;
document.getElementById('t-kicker').textContent=DATA.teamKicker;
document.getElementById('t-title').innerHTML=gradTitle(DATA.teamTitle);
document.getElementById('t-members').innerHTML=DATA.team.map(function(m){
  var av = m.img ? '<div class="avatar reveal" style="background-image:url('+m.img+')"></div>'
                 : '<div class="avatar reveal">'+esc(m.name.split(' ').map(function(w){return w[0]}).join(''))+'</div>';
  return '<div class="member">'+av+'<h3>'+esc(m.name)+'</h3><p>'+esc(m.role)+'</p></div>';
}).join('');
document.getElementById('c-kicker').textContent=DATA.conKicker;
document.getElementById('c-title').innerHTML=gradTitle(DATA.conTitle);
document.getElementById('c-big').textContent=DATA.conBig;
document.getElementById('c-addr').textContent=DATA.address;
document.getElementById('c-phones').innerHTML=esc(DATA.phones).replace(/\n/g,'<br>');
document.getElementById('c-email').textContent=DATA.email;
document.getElementById('footer').textContent=DATA.footer;

var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
</script>
</body>
</html>
